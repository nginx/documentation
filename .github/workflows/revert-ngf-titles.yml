name: Revert NGF title edits

"on":
  push:
    branches: ["ngf/f5-metadata-and-titles"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ngf/f5-metadata-and-titles
          fetch-depth: 0

      - name: Restore existing titles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          titles = {
              'content/ngf/changelog.md': ('NGINX Gateway Fabric changelog', 'Changelog'),
              'content/ngf/get-started.md': ('Get started with NGINX Gateway Fabric', 'Get started'),
              'content/ngf/how-to/gateway-api-inference-extension.md': ('Configure Gateway API Inference Extension routing', 'Gateway API Inference Extension'),
              'content/ngf/overview/custom-policies.md': ('Custom policies for NGINX data plane features', 'Custom policies'),
              'content/ngf/overview/product-telemetry.md': ('Product telemetry collection', 'Product telemetry'),
              'content/ngf/overview/resource-validation.md': ('Resource validation for Gateway API objects', 'Resource validation'),
              'content/ngf/reference/permissions.md': ('Component permissions and security context', 'Permissions'),
              'content/ngf/support.md': ('Support for NGINX Gateway Fabric', 'Support'),
              'content/ngf/traffic-management/client-settings.md': ('Configure client settings with ClientSettingsPolicy', 'Client Settings Policy API'),
              'content/ngf/traffic-management/listener-sets.md': ('Configure additional Gateway listeners with ListenerSet', 'ListenerSet API'),
              'content/ngf/traffic-management/rate-limit.md': ('Configure rate limiting with RateLimitPolicy', 'Rate Limit Policy API'),
              'content/ngf/traffic-management/session-persistence.md': ('Configure session persistence for backend pods', 'Session Persistence'),
              'content/ngf/traffic-management/snippets.md': ('Insert custom NGINX configuration with Snippets', 'Snippets'),
              'content/ngf/traffic-management/tcp-routing.md': ('Route TCP traffic with TCPRoute', 'TCPRoute'),
              'content/ngf/traffic-management/udp-routing.md': ('Route UDP traffic with UDPRoute', 'UDPRoute'),
              'content/ngf/traffic-management/upstream-settings.md': ('Configure upstream connections with UpstreamSettingsPolicy', 'Upstream Settings Policy API'),
              'content/ngf/troubleshooting.md': ('Troubleshoot NGINX Gateway Fabric', 'Troubleshooting'),
          }

          for filename, (current, original) in titles.items():
              path = Path(filename)
              text = path.read_text()
              old = f'title: {current}'
              new = f'title: {original}'
              if old not in text:
                  raise SystemExit(f'expected title not found: {filename}')
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify title scope
        shell: bash
        run: |
          git remote add upstream https://github.com/nginx/documentation.git
          git fetch --depth=1 upstream main
          if git diff upstream/main -- content/ngf | grep -E '^[+-]title:'; then
            echo 'title changes remain'
            exit 1
          fi

      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/revert-ngf-titles.yml
          git config user.name sankalpsthakur
          git config user.email 31366524+sankalpsthakur@users.noreply.github.com
          git add -A
          git commit -m 'docs(ngf): retain existing page titles'
          git push origin HEAD:ngf/f5-metadata-and-titles
