name: Refresh coveo searchToken for docs dev/staging/production
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */23 * * *"

permissions:
  id-token: write

jobs:
  generate-coveo-search-token:
    name: Generate Coveo Search Tokens
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # for 8398a7/action-slack
    strategy:
      matrix:
        include:
          - env_name: dev
            env_api_key: "COVEO_API_DEV"
            env_coveo_org_id: "f5networkx1h1607h"
          - env_name: staging
            env_api_key: "COVEO_API_STAGING"
            env_coveo_org_id: "f5networksnonproduction1xqykzabw"
          - env_name: prod
            env_api_key: "COVEO_API_PROD"
            env_sphinx_api_key: "COVEO_SPHINX_API_PROD"
            env_coveo_org_id: "f5networksproduction5vkhn00h"
    steps:
      - name: Install jq
        run: sudo apt-get install jq

      - name: Generating token for ${{matrix.env_name}} ...
        id: generate-token
        continue-on-error: true
        env:
          COVEO_API_KEY: ${{secrets[matrix.env_api_key]}}
          COVEO_SPHINX_API_KEY: ${{secrets[matrix.env_sphinx_api_key]}}
          COVEO_SEARCH_HUB: "HUB_ES_Nginx_Docs_And_Org"
        run: |
          RESPONSE=$(curl -w "\nHTTP_CODE: %{http_code}" -s -X POST "https://platform.cloud.coveo.com/rest/search/v2/token?organizationId=${{matrix.env_coveo_org_id}}" \
          -H "Accept: application/json" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${COVEO_API_KEY}" \
          -d '{
              "searchHub": "'${COVEO_SEARCH_HUB}'",
              "organization": "'${{matrix.env_coveo_org_id}}'",
              "userIds": [
                  {
                  "type": "User",
                  "name": "anonymous",
                  "provider": "Email Security Provider"
                  }
              ]
              }')
          STATUS_CODE=$(echo "$RESPONSE" | grep HTTP_ | awk '{print $2}')
          SEARCH_TOKEN=$(echo "$RESPONSE" | sed '$d' | jq -r '.token')

          if [ $STATUS_CODE -ne 200 ]; then
            echo "Error: HTTP request failed with status $STATUS_CODE"
            echo "$RESPONSE"
            exit 1
          fi
          if [ "$SEARCH_TOKEN" == "null" ]; then
            echo "Error: Failed to extract search token from response"
            exit 1
          fi

          if [ "${{ matrix.env_name }}" = "prod" ]; then
            SPHINX_RESPONSE=$(curl -w "\nHTTP_CODE: %{http_code}" -s -X POST "https://platform.cloud.coveo.com/rest/search/v2/token?organizationId=${{matrix.env_coveo_org_id}}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${COVEO_SPHINX_API_KEY}" \
            -d '{
                "searchHub": "'${COVEO_SEARCH_HUB}'",
                "organization": "'${{matrix.env_coveo_org_id}}'",
                "userIds": [
                    {
                    "type": "User",
                    "name": "anonymous",
                    "provider": "Email Security Provider"
                    }
                ]
                }')
            SPHINX_STATUS_CODE=$(echo "$SPHINX_RESPONSE" | grep HTTP_ | awk '{print $2}')
            SPHINX_SEARCH_TOKEN=$(echo "$SPHINX_RESPONSE" | sed '$d' | jq -r '.token')

            if [ $SPHINX_STATUS_CODE -ne 200 ]; then
              echo "Error: HTTP request failed with status $SPHINX_STATUS_CODE"
              echo "$SPHINX_RESPONSE"
              exit 1
            fi
            if [ "$SPHINX_SEARCH_TOKEN" == "null" ]; then
              echo "Error: Failed to extract search token from response"
              exit 1
            fi
          fi

          mkdir coveo/
            
          if [ "${{ matrix.env_name }}" = "prod" ]; then
            echo "{\"token\": \"$SEARCH_TOKEN\", \"org_id\": \"${{matrix.env_coveo_org_id}}\", \"sphinx_theme_token\": \"$SPHINX_SEARCH_TOKEN\"}" > coveo/search_token.json
          else
            echo "{\"token\": \"$SEARCH_TOKEN\", \"org_id\": \"${{matrix.env_coveo_org_id}}\"}" > coveo/search_token.json
          fi

      - name: Upload token for ${{matrix.env_name}}
        if: ${{ steps.generate-token.outcome == 'success' }}
        uses: actions/upload-artifact@v6.0.0
        with:
          name: ${{matrix.env_name}}
          path: "./"

      - name: Send a notification if token generation step failed
        if: ${{ steps.generate-token.outcome == 'failure' }}
        uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e # v3.19.0
        with: 
          status: custom
          custom_payload: |
            {
                username: 'Github',
                mention: 'channel',
                attachments: [{
                  title: '[${{ github.event.repository.full_name }}] Coveo Token Generation Failed (${{matrix.env_name}} environment)',
                  color: 'danger',
                  fields: [{
                    title: 'Pipeline URL',
                    value: '<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.run_id }}>',
                    short: false
                  }]
                }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_DOCS_INCIDENT }}
          

  push-tokens-to-azure:
    name: Batch push coveo search tokens to Azure
    runs-on: ubuntu-latest
    needs: generate-coveo-search-token
    steps:
      - name: Download Coveo search token
        uses: actions/download-artifact@v7

      - name: View files
        run: ls -R

      - name: Login to Azure
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.DOCS_OIDC_CLIENT }}
          tenant-id: ${{ secrets.DOCS_OIDC_TENANT }}
          subscription-id: ${{ secrets.DOCS_OIDC_SUB }}

      - name: Retrieve secrets from keyvault
        uses: nginx/ci-self-hosted/.github/actions/get-from-vault@0fc1fc087a55f75740cebba008010c812b6d0da2 #main
        with:
          vault-name: ${{ secrets.AZURE_KEY_VAULT_DOCS }}
          secret-names: resourceGroupName, cdnProfileName, cdnName, accountName
          env-names: AZ_RESOURCE_GROUP, AZ_CDN_PROFILE, AZ_CDN, AZ_ACCOUNT

      - name: Push to Azure container storage
        uses: azure/cli@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
        with:
          azcliversion: latest
          inlineScript: |
            az storage blob upload-batch \
              -s ./ \
              -d '$web' \
              --account-name ${{ env.AZ_ACCOUNT }} \
              --overwrite \
              --content-cache-control "no-store" \
              --auth-mode login
  
            az afd endpoint purge \
              --resource-group ${{ env.AZ_RESOURCE_GROUP }} \
              --profile-name ${{ env.AZ_CDN_PROFILE }} \
              --endpoint-name ${{ env.AZ_CDN }} \
              --domains docs.nginx.com docs-dev.nginx.com docs-staging.nginx.com \
              --content-paths '/.netlify/functions/*'
